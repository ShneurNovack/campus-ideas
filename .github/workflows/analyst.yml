# The offline engine, once a day. It pulls the public sign-up data, recomputes everything and uploads the page
# payloads to the Worker's bucket. It holds no secret: the Worker accepts a short-lived token that GitHub signs
# for this workflow on the main branch (worker/oidc.js).
name: analyst
on:
  schedule:
    - cron: "47 9 * * *"   # 09:47 UTC, early morning in North America
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: analyst
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      # embeddings already computed for unchanged event text
      - uses: actions/cache@v4
        with:
          path: |
            engine/data/work/emb_name_keys.json
            engine/data/work/emb_name_vecs.npy
            engine/data/work/emb_blurb_keys.json
            engine/data/work/emb_blurb_vecs.npy
            engine/data/work/axes.npy
          key: embed2-cache-${{ github.run_id }}
          restore-keys: embed2-cache-
      - name: Pull the public data
        run: python -m engine.pull
      - name: Compute and publish
        run: python -m engine.run push
